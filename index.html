<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业抢答系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="page active">
    <div class="container">
        <h2>🔐 抢答系统登录</h2>
        <input type="text" id="user" placeholder="用户名" class="input-box"><br>
        <input type="password" id="pwd" placeholder="密码" class="input-box"><br>
        <input type="text" id="roomId" placeholder="房间号" class="input-box"><br>
        <input type="password" id="roomPwd" placeholder="房间密码" class="input-box"><br>
        <button class="btn" onclick="login()">登录</button>
        <button class="btn" onclick="register()">注册</button>
    </div>
</div>

<!-- 主界面 -->
<div id="mainPage" class="page">
    <div class="container">
        <h2>🎯 抢答游戏</h2>
        <div id="userInfo"></div>
        <div id="memberList" class="member-box"></div>
        <div id="status" class="status">等待管理员开始...</div>
        <div id="timer" class="timer">00.000</div>

        <div id="adminPanel" class="admin-panel">
            <button class="start-btn" onclick="startGame()">▶️ 开始抢答</button>
            <button class="reset-btn" onclick="resetGame()">🔄 重置本轮</button>
            <button class="score-btn" onclick="showScoreModal()">✏️ 修改分数</button>
        </div>

        <button id="buzzBtn" class="buzz-btn" disabled>🚀 点击抢答</button>
        <div id="result" class="result"></div>
        <button class="profile-btn" onclick="openMyProfile()">📊 我的账户</button>
        <div id="history" class="history"></div>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
</div>

<!-- 成员资料页 -->
<div id="profilePage" class="page">
    <div class="container">
        <h2>👤 成员资料</h2>
        <div id="profileInfo"></div>
        <div id="profileRecords"></div>
        <button class="btn" onclick="backToMain()">返回主页</button>
    </div>
</div>

<!-- 修改分数弹窗 -->
<div id="scoreModal" class="modal">
    <div class="modal-content">
        <h3>修改分数</h3>
        <select id="scoreUser"></select>
        <input type="number" id="addScore" placeholder="输入分数" class="input-box"><br>
        <button onclick="saveScore()">保存</button>
        <button onclick="closeModal()">关闭</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线抢答器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📢 在线抢答游戏</h1>
        <div class="name-box">
            <input type="text" id="username" placeholder="输入你的名字" required>
        </div>
        <button id="buzzBtn" class="buzz-btn">👉 点我抢答</button>
        <div id="result" class="result"></div>
        <button id="resetBtn" class="reset-btn">🔄 管理员重置</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
